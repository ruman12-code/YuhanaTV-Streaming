name: Update IPTV

# Spec section 20 pipeline:
#   FETCH -> VALIDATE -> NORMALIZE -> DEDUPE -> CHECK STREAMS -> UPDATE DB
#   -> GENERATE M3U -> GENERATE EPG -> VALIDATE M3U -> VALIDATE EPG -> DEPLOY -> PUBLISH
#
# NOTE ON GEOGRAPHY: GitHub-hosted runners are outside Bangladesh. A channel that
# is only served to BD clients will be reported OFFLINE here even though it plays
# on the owner's TV. That is why `consecutive_failures_before_offline` exists and
# why a single failing run never removes a channel. See docs/LIMITATIONS.md.

on:
  schedule:
    - cron: '0 */6 * * *'      # stream validation, every 6 hours (spec section 21)
  workflow_dispatch:
    inputs:
      seed:
        description: 'Publish UNVERIFIED channels (pre-validation seed build)'
        type: boolean
        default: false
      limit:
        description: 'Validate only the first N channels (0 = all)'
        type: string
        default: '0'
  push:
    paths:
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/update-iptv.yml'

permissions:
  contents: write

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Normalize and de-duplicate the source registry
        run: python3 scripts/pipeline.py ingest

      - name: Classify source provenance
        run: python3 scripts/classify_sources.py

      - name: Check streams
        run: python3 scripts/pipeline.py check --limit "${{ github.event.inputs.limit || 0 }}"

      - name: Canonical tvg-ids and EPG
        run: python3 scripts/build_epg.py

      - name: Generate playlists
        run: |
          if [ "${{ github.event.inputs.seed }}" = "true" ]; then
            python3 scripts/pipeline.py build --seed
          else
            python3 scripts/pipeline.py build
          fi

      # These run even when the build step failed, so a shut health gate still
      # produces a readable report instead of an opaque red cross.
      - name: Validate playlists
        if: always()
        run: python3 scripts/pipeline.py verify --verbose

      - name: Validation report
        if: always()
        run: python3 scripts/pipeline.py report

      - name: Job summary
        if: always()
        run: python3 scripts/summarise.py

      - name: Upload report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation-report.json
            data/status/

      - name: Commit refreshed playlists
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # playlists/, data/ and validation-report.json are pipeline OUTPUT, not
          # source. If another run lands first, merging them is meaningless and
          # always conflicts: this run's files are the newer measurement, so the
          # remote is taken as the new base and the outputs are re-applied on top.
          commit_outputs() {
            git add -A playlists data site validation-report.json
            [ -d epg ] && git add -A epg || true
            if git diff --cached --quiet; then
              echo "no content change"
              return 1
            fi
            git commit -m "chore: refresh playlists and validation report [skip ci]"
            return 0
          }

          commit_outputs || exit 0

          for attempt in 1 2 3; do
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing outputs onto the remote"
            STAGE=$(mktemp -d)
            cp -r playlists data site validation-report.json "$STAGE"/ 2>/dev/null || true
            [ -d epg ] && cp -r epg "$STAGE"/ || true
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            # Replace the output trees rather than merging into them. cp -r only
            # adds and overwrites: a playlist this run deliberately removed would
            # survive in the reset tree and be republished as an orphan, which is
            # how nineteen unreachable files reached the TV.
            rm -rf playlists site
            cp -r "$STAGE"/. . 2>/dev/null || true
            rm -rf "$STAGE"
            commit_outputs || exit 0
          done
          echo "could not push after 3 attempts" >&2
          exit 1

  # Deploy runs only on the repository's default branch, and is allowed to fail
  # without failing the pipeline: GitHub Pages must be enabled by hand once
  # (Settings -> Pages -> Source: GitHub Actions) before it can succeed.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Stage the public site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          # Without an index.html, Pages answers the site root with its own 404
          # even though every playlist under it is served correctly.
          cp site/index.html _site/index.html
          cp -r playlists _site/playlists
          [ -d epg ] && cp -r epg _site/epg || true
          cp validation-report.json _site/ 2>/dev/null || true
          cp data/search-index.json _site/ 2>/dev/null || true
          # Stable short aliases (spec section 19): /iptv/master.m3u etc.
          mkdir -p _site/iptv
          cp playlists/master.m3u            _site/iptv/master.m3u
          cp playlists/live/live-tv.m3u      _site/iptv/live-tv.m3u
          cp playlists/live/bangladesh.m3u   _site/iptv/bangladesh.m3u
          [ -f playlists/live/international.m3u ] && cp playlists/live/international.m3u _site/iptv/international.m3u || true
          [ -f playlists/movies/movies.m3u ]      && cp playlists/movies/movies.m3u      _site/iptv/movies.m3u || true
          [ -f epg/epg.xml ]                      && cp epg/epg.xml                      _site/iptv/epg.xml || true
          echo "--- published files ---"
          find _site -type f | sort

      # enablement: true turns Pages on via the API if it is not already on,
      # which removes the manual Settings step entirely.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
