name: Refresh Movies

# Movie metadata refreshes daily (spec section 21), separately from the live-TV
# pipeline: the two have different cadences and different failure modes, and a
# movie-source outage must not hold up live-channel validation.

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Import at most N titles (0 = configured maximum)'
        type: string
        default: '0'
      dry_run:
        description: 'Report what would be imported, write nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  movies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Fetch movie metadata
        run: |
          python3 scripts/fetch_movies.py \
            --limit "${{ github.event.inputs.limit || 0 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Attach IMDb ratings and build the search index
        if: github.event.inputs.dry_run != 'true'
        run: python3 scripts/enrich_movies.py

      - name: Verify playback URLs
        if: github.event.inputs.dry_run != 'true'
        run: python3 scripts/pipeline.py check-vod

      - name: Rebuild playlists
        if: github.event.inputs.dry_run != 'true'
        run: python3 scripts/pipeline.py build

      - name: Validate playlists
        if: always()
        run: python3 scripts/pipeline.py verify --verbose

      - name: Validation report
        if: always()
        run: python3 scripts/pipeline.py report

      - name: Job summary
        if: always()
        run: python3 scripts/summarise.py

      - name: Commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # playlists/, data/ and validation-report.json are pipeline OUTPUT, not
          # source. If another run lands first, merging them is meaningless and
          # always conflicts: this run's files are the newer measurement, so the
          # remote is taken as the new base and the outputs are re-applied on top.
          commit_outputs() {
            git add -A playlists data site validation-report.json
            [ -d epg ] && git add -A epg || true
            if git diff --cached --quiet; then
              echo "no content change"
              return 1
            fi
            git commit -m "chore: refresh movie catalogue [skip ci]"
            return 0
          }

          commit_outputs || exit 0

          for attempt in 1 2 3; do
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing outputs onto the remote"
            STAGE=$(mktemp -d)
            cp -r playlists data site validation-report.json "$STAGE"/ 2>/dev/null || true
            [ -d epg ] && cp -r epg "$STAGE"/ || true
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp -r "$STAGE"/. . 2>/dev/null || true
            rm -rf "$STAGE"
            commit_outputs || exit 0
          done
          echo "could not push after 3 attempts" >&2
          exit 1
