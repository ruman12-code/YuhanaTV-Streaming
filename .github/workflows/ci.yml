name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        # Code only. Checks on build output run after the build: run before it
        # they test the previous run's files and can block the fix.
        env:
          YUHANA_SKIP_BUILD_OUTPUT_TESTS: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Structural validation of committed playlists
        run: python3 scripts/pipeline.py verify --verbose
